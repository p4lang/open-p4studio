name: "test-ubuntu"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

# Cancel any preceding run on the pull request.
concurrency:
  group: test-ubuntu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Build with GCC and test P4C on different Ubuntu distributions.
  test-ubuntu:
    name: test-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      CI_PROFILE: ./p4studio/profiles/testing.yaml
    steps:
      - name: Remove unused software
        run: |
          echo "Available storage before:"
          sudo df -h
          echo
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          echo "Available storage after:"
          sudo df -h
          echo -h
          echo
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: test-${{ matrix.os }}
          max-size: 2000M

      - name: Install OS dependencies
        run: python3 p4studio dependencies install --profile "$CI_PROFILE" --types os

      - name: Identify native dependency build
        id: native
        run: |
          # Some installed files embed the absolute install prefix.
          signature=$({
            echo "$GITHUB_WORKSPACE/install"
            gcc -v 2>&1
            python3 -VV
            dpkg-query -W -f='${binary:Package} ${Version}\n' '*-dev' cmake
          } | sha256sum | cut -d' ' -f1)
          echo "signature=$signature" >> "$GITHUB_OUTPUT"

      - name: Restore native dependencies
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: install
          key: native-v1-${{ matrix.os }}-${{ runner.arch }}-${{ steps.native.outputs.signature }}-${{ hashFiles('p4studio/dependencies/**/*.py', 'p4studio/dependencies/*.yaml', 'p4studio/utils/*.py', 'p4studio/profile/*.py', 'p4studio/profiles/testing.yaml') }}

      - name: Build native dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        env:
          CCACHE_BASEDIR: /tmp/p4studio-dependencies
          CCACHE_NOHASHDIR: "1"
        run: |
          python3 p4studio dependencies install --profile "$CI_PROFILE" --types source \
            --jobs "$(nproc)" --working-dir "$CCACHE_BASEDIR"

      # Save before pip or the SDE writes into the same installation directory.
      - name: Save native dependencies
        if: steps.deps.outputs.cache-hit != 'true' && github.event_name != 'merge_group'
        uses: actions/cache/save@v4
        with:
          path: install
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Install Python dependencies
        run: python3 p4studio dependencies install --profile "$CI_PROFILE" --types pip3

      - name: Build
        run: |
          ccache -z
          ./p4studio/p4studio profile apply --skip-dependencies --jobs "$(nproc)" "$CI_PROFILE"
          ccache -s

      - name: Show build logs
        if: success() || failure()
        run: |
          ./ci/show-build-logs.sh

      - name: Run tests
        run: |
          # FIXME: Move these into a separate test suite.
          make -C build tna_counter install
          ./ci/run-test.py --sde "$PWD" --sde-install "$PWD/install" tna_counter
